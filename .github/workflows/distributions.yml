name: Distributions

# Building stays separate from the one job allowed to publish.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the complete Python release to PyPI (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install cibuildwheel==4.3.1
      - run: python -m cibuildwheel --output-dir "${{ runner.temp }}/wheelhouse"
        env:
          CIBW_BUILD: cp312-* cp313-* cp314-*
          CIBW_SKIP: '*musllinux*'
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: 'FATCAT_BUILD_REVISION=${{ github.sha }} FATCAT_BUILD_DIRTY=0 MACOSX_DEPLOYMENT_TARGET=14.0'
          CIBW_TEST_COMMAND: 'python "{project}/scripts/check_installed_package.py" && python -m fatcat_metadata_cli --version'
      - run: python scripts/package_distribution.py --dist-dir "${{ runner.temp }}/wheelhouse" --output-dir "${{ runner.temp }}/prepared-wheels"
      - uses: actions/upload-artifact@v7
        with:
          name: fatcat-wheels-${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-wheels/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --sdist --outdir "${{ runner.temp }}/source"
      - name: Build and install from the source distribution
        run: |
          python -m pip wheel "${{ runner.temp }}"/source/*.tar.gz --no-deps --wheel-dir "${{ runner.temp }}/source-wheel"
          python -m pip install --no-index --find-links "${{ runner.temp }}/source-wheel" fatcat-metadata
        env:
          FATCAT_BUILD_REVISION: ${{ github.sha }}
          FATCAT_BUILD_DIRTY: "0"
      - run: python "${{ github.workspace }}/scripts/check_installed_package.py"
        working-directory: ${{ runner.temp }}
      - run: python -m fatcat_metadata_cli --version
        working-directory: ${{ runner.temp }}
      - run: python scripts/package_distribution.py --dist-dir "${{ runner.temp }}/source" --output-dir "${{ runner.temp }}/prepared-source"
      - uses: actions/upload-artifact@v7
        with:
          name: fatcat-source-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-source/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  python-release:
    needs: [wheels, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: fatcat-wheels-*
          path: ${{ runner.temp }}/prepared/wheels
      - uses: actions/download-artifact@v8
        with:
          name: fatcat-source-${{ github.sha }}
          path: ${{ runner.temp }}/prepared/source
      - name: Collect the complete Python release
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          wheels = sorted(Path("prepared/wheels").rglob("*.whl"))
          sources = sorted(Path("prepared/source").glob("*.tar.gz"))
          if len(wheels) != 9 or len(sources) != 1:
              raise SystemExit("Expected nine platform/Python wheels and one source distribution")
          Path("dist").mkdir()
          for artifact in wheels + sources:
              shutil.copy2(artifact, Path("dist") / artifact.name)
          PY
          python "${{ github.workspace }}/scripts/package_distribution.py" --dist-dir dist --output-dir release
          python -m pip install twine
          python -m twine check --strict release/*.whl release/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: fatcat-python-release-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  pypi:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: python-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fatcat-metadata
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fatcat-python-release-${{ github.sha }}
          path: release
      - name: Stage only uploadable Python distributions
        run: |
          mkdir dist
          cp release/*.whl release/*.tar.gz dist/
      - name: Publish the prepared distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  sdk:
    if: '!inputs.publish'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cmake -S cpp -B build -DFATCAT_BUILD_PYTHON=OFF -DFATCAT_BUILD_TESTS=OFF -DFATCAT_INSTALL_CPP=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
      - run: cmake --build build --config Release --parallel 2
      - run: cmake --install build --config Release --prefix "${{ runner.temp }}/fatcat-sdk"
      - run: python scripts/package_distribution.py --sdk-prefix "${{ runner.temp }}/fatcat-sdk" --output-dir "${{ runner.temp }}/prepared-sdk"
      - uses: actions/upload-artifact@v7
        with:
          name: fatcat-sdk-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-sdk/
          retention-days: 90
