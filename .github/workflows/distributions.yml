name: Prepare distributions

# Deliberately manual: produce reviewable files, never publish to PyPI/Releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install cibuildwheel==4.3.0
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp312-* cp313-* cp314-*
          CIBW_SKIP: '*musllinux*'
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: 'FATCAT_BUILD_REVISION=${{ github.sha }} FATCAT_BUILD_DIRTY=0 MACOSX_DEPLOYMENT_TARGET=14.0'
      - run: python scripts/package_distribution.py --wheel-dir wheelhouse --output-dir "${{ runner.temp }}/prepared-wheels"
      - uses: actions/upload-artifact@v7
        with:
          name: fatcat-wheels-${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-wheels/
          retention-days: 90

  sdk:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cmake -S cpp -B build -DFATCAT_BUILD_PYTHON=OFF -DFATCAT_BUILD_TESTS=OFF -DFATCAT_INSTALL_CPP=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
      - run: cmake --build build --config Release --parallel 2
      - run: cmake --install build --config Release --prefix "${{ runner.temp }}/fatcat-sdk"
      - run: python scripts/package_distribution.py --sdk-prefix "${{ runner.temp }}/fatcat-sdk" --output-dir "${{ runner.temp }}/prepared-sdk"
      - uses: actions/upload-artifact@v7
        with:
          name: fatcat-sdk-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-sdk/
          retention-days: 90
